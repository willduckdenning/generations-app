kind = "mobile"
previewPath = "/"
title = "Generations"
description = "A family connection mobile app with role-based experiences for grandparents, parents, and grandchildren, family updates, messages, photos and voice notes."
version = "1.0.0"
id = "artifacts/generations"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26071

[services.development]
run = "pnpm --filter @workspace/generations run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/generations", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/generations", "run", "serve" ]

[services.env]
PORT = "26071"
BASE_PATH = "/"
